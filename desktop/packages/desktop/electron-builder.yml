appId: com.ensemble.system
productName: 合鸣
electronVersion: 43.3.0
copyright: Copyright © 2026 合鸣
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  # 前端静态资源 → resources/dist（server.ts prod 加载该路径）
  - from: ../web/dist
    to: dist
  # 托盘/系统图标 → resources/icon.png
  - from: build/icon.png
    to: icon.png
  # 测试环境默认云端地址 → resources/server.config.js
  - from: ../../server.config.js
    to: server.config.js
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 合鸣
  uninstallDisplayName: 合鸣
  deleteAppDataOnUninstall: false
  artifactName: ensemble-${version}-setup.${ext}