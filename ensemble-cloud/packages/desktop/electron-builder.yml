# 合鸣 · 本地版 安装包配置（electron-builder 默认配置）
# 业务逻辑已由 esbuild 全量打进 dist/main/index.cjs，运行时仅依赖 electron 本体，
# 故 asar 内不带 node_modules（node-llama-cpp 为未使用的遗留 external）。
# 云端版用 electron-builder.cloud.yml；差异仅为产品名/appId/内置 edition 标识。
appId: com.ensemble.system.local
productName: 合鸣本地版
directories:
  output: release
asar: true
files:
  - dist/**
  - package.json
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: 合鸣-本地版-${version}-setup.exe
extraResources:
  - from: ../web/dist
    to: dist
  - from: build/icon.png
    to: icon.png
  - from: build/edition-local.txt
    to: edition.txt
