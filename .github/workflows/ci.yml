name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: cd desktop && pnpm install --frozen-lockfile
      # 先 build shared 与 server：desktop 包 typecheck 依赖 server 的 dist 产物，
      # 未 build 会报 TS2307 模块未找到。之后用 -r 递归跑全部包，避免新增包漏检。
      - run: cd desktop && pnpm --filter @ensemble/shared build && pnpm --filter @ensemble/server build
      - run: cd desktop && pnpm -r typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: cd desktop && pnpm install --frozen-lockfile
      - run: cd desktop && pnpm --filter @ensemble/shared build
      - run: cd desktop && pnpm --filter @ensemble/server test
      # web 的纯函数测试（vitest 配置为 environment: node，不需 DOM）
      - run: cd desktop && pnpm --filter @ensemble/web test

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: cd desktop && pnpm install --frozen-lockfile
      - run: cd desktop && pnpm --filter @ensemble/shared build
      - run: cd desktop && pnpm --filter @ensemble/server build
      - run: cd desktop && pnpm --filter @ensemble/web build
      - run: cd desktop && pnpm --filter @ensemble/desktop build

  docker:
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ensemble-relay ./relay-server
