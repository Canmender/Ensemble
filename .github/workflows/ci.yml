name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: cd desktop && pnpm install --frozen-lockfile
      - run: cd desktop && pnpm --filter @ensemble/shared build
      - run: cd desktop && pnpm -r typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: cd desktop && pnpm install --frozen-lockfile
      - run: cd desktop && pnpm --filter @ensemble/shared build
      - run: cd desktop && pnpm --filter @ensemble/server test

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: cd desktop && pnpm install --frozen-lockfile
      - run: cd desktop && pnpm --filter @ensemble/shared build
      - run: cd desktop && pnpm --filter @ensemble/server build
      - run: cd desktop && pnpm --filter @ensemble/web build

  docker:
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ensemble-relay ./relay-server
