# 合鸣（Ensemble）Docker Compose 部署配置
#
# 使用方式:
#   开发: docker compose up
#   生产: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.8"

services:
  # ========== Ensemble Server（主服务：账号/Agent/会话/RAG） ==========
  server:
    build:
      context: ./desktop
      dockerfile: Dockerfile
    container_name: ensemble-server
    ports:
      - "${ENSEMBLE_PORT:-8787}:8787"
    environment:
      - PORT=8787
      - ENSEMBLE_STATIC_DIR=/app/web-dist
      - DB_PATH=/data/ensemble.db
      - CONFIG_DIR=/data/config
      # 公网部署必须设置 ENSEMBLE_API_KEY（机器级凭证 + 禁用 /api/ws-token 防绕过）；
      # 用户通过 Web 登录页注册/登录账号
      - ENSEMBLE_API_KEY=${ENSEMBLE_API_KEY:-}
      - ENSEMBLE_LAN_HOST=0.0.0.0
      - ENSEMBLE_AUTO_SYNC_LOCAL=false
      # 中继连接 / 云端地址由宿主 .env 提供（不硬编码真实 IP/密钥到仓库）
      - RELAY_URL=${RELAY_URL:-}
      - RELAY_AUTH_KEY=${RELAY_AUTH_KEY:-}
      - CLOUD_HOST=${CLOUD_HOST:-}
    volumes:
      - ensemble-data:/data
      - /data/backups:/data/backups
    restart: unless-stopped
    networks:
      - ensemble-net

  # ========== 中继服务器 ==========
  relay:
    build:
      context: ./relay-server
      dockerfile: Dockerfile
    container_name: ensemble-relay
    ports:
      - "${RELAY_PORT:-8888}:8888"
    environment:
      - PORT=8888
      - CORS_ORIGINS=*
      # 生产环境请设置 RELAY_AUTH_KEY（Socket.IO 握手 + /devices 鉴权）
      - RELAY_AUTH_KEY=${RELAY_AUTH_KEY:-}
      - OFFLINE_MESSAGE_EXPIRY=86400000
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      # node:20-slim 无 curl，用 node 内置 fetch 探活
      test: ["CMD", "node", "-e", "fetch('http://localhost:8888/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - ensemble-net

  # ========== Nginx 反向代理 (可选) ==========
  nginx:
    image: nginx:alpine
    container_name: ensemble-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ensemble-net
    profiles:
      - production

networks:
  ensemble-net:
    driver: bridge

volumes:
  ensemble-data:
