# 合鸣 生产环境配置
# 使用: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.8"

services:
  relay:
    environment:
      - LOG_LEVEL=warn
      - RATE_LIMIT_WINDOW=60000
      - RATE_LIMIT_MAX=100
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
